name: Daily business news

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-business-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test date filtering and link handling
        run: python -m unittest discover -s tests -v
      - name: Collect links and create or update today's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/news_digest.py --publish
